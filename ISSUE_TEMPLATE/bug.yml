name: Bug report
description: An unexpected problem or behavior.
title: ""
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please check open issues first to avoid duplicates.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Summarize the problem and its impact.
    validations:
      required: true

  - type: textarea
    id: repro-steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the issue.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Version, OS, browser, or other relevant environment details.
      placeholder: e.g. v1.4.2, macOS 15, Chrome 128
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Logs, screenshots, stack traces, or anything else relevant.
    validations:
      required: false
