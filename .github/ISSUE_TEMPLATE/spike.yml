name: Spike
description: Investigation or prototype intended to inform a decision.
type: Spike
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What question or hypothesis should this spike answer? What's the approach, and what decision should the outcome inform?
    validations:
      required: true

  - type: input
    id: timebox
    attributes:
      label: Timebox
      description: How much time is allocated to this spike?
      placeholder: e.g. 2 days, 1 sprint
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
    validations:
      required: false
