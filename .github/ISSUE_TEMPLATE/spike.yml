name: Spike
description: Investigation or prototype intended to inform a decision.
title: ""
type: Spike
body:
  - type: markdown
    attributes:
      value: |
        Use this template for time-boxed investigations or prototypes meant to inform a decision, not to ship production code.

  - type: textarea
    id: question
    attributes:
      label: Question / hypothesis
      description: What question or hypothesis should this spike answer?
    validations:
      required: true

  - type: textarea
    id: approach
    attributes:
      label: Approach
      description: How do you plan to investigate this?
    validations:
      required: false

  - type: input
    id: timebox
    attributes:
      label: Timebox
      description: How much time is allocated to this spike?
      placeholder: e.g. 2 days, 1 sprint
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: What decision or artifact should come out of this spike (e.g. a recommendation, a go/no-go, a design doc)?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
    validations:
      required: false
