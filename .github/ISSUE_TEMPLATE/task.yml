name: Task
description: A specific piece of work.
title: ""
type: Task
body:
  - type: markdown
    attributes:
      value: |
        Use this template for well-defined work that isn't a bug fix or a new feature request.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done, and why?
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: How do we know this task is complete?
      placeholder: |
        - [ ] First acceptance criterion
        - [ ] Second acceptance criterion
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
    validations:
      required: false
